syntax = "proto2";
package WAWebLabyrinthWaWasm;
option go_package = "go.mau.fi/whatsmeow/proto/waWebLabyrinthWaWasm";

message CreateBackupInput {
	required string recoveryCode = 1;
	required uint64 userID = 2;
}

message EncryptMessageInput {
	required bytes epochRootKey = 1;
	required bytes mailboxRootKey = 2;
	required bytes orfClientState = 3;
	required bytes epochAnonID = 4;
	required uint64 epochID = 5;
	required string threadID = 6;
	required uint64 waCanonicalUserFbid = 7;
	required uint64 timestampMS = 8;
	required uint64 backupID = 9;
	required bytes plaintextPayload = 10;
	required string stanzaID = 11;
}

message DecryptMessageInput {
	required bytes epochRootKey = 1;
	required bytes epochAnonID = 2;
	required string threadID = 3;
	required int32 encryptionVersion = 4;
	required bytes ciphertext = 5;
}

message OrfThreadIdInput {
	required bytes orfClientState = 1;
	required string threadID = 2;
}

message DeriveMessageKeyInput {
	required bytes epochRootKey = 1;
	required bytes epochAnonID = 2;
	required string threadID = 3;
}

message DeriveVirtualDeviceIdInput {
	required string recoveryCode = 1;
	required uint64 userID = 2;
}

message AddDeviceSyncEpochInput {
	required uint64 epochID = 1;
	required bytes epochAnonID = 2;
	optional bytes encryptedEpochKey = 3;
	required bytes senderAuthPubKey = 4;
	optional uint64 nextEpochID = 5;
}

message PrepareAddDeviceInput {
	required string recoveryCode = 1;
	required uint64 userID = 2;
	required string encryptedSecretValuesJSON = 3;
	required uint64 virtualDeviceBaseEpochID = 4;
	required uint64 activeEpochID = 5;
	repeated AddDeviceSyncEpochInput syncEpochs = 6;
}

message DeviceOutput {
	required bytes publicKey = 1;
	required bytes epochAuthPublicKey = 2;
	required bytes epochAuthPublicKeySig = 3;
	required bytes epochStoragePublicKey = 4;
	required bytes epochStoragePublicKeySig = 5;
	repeated int32 supportedEncryptionVersions = 6;
	required bytes encryptionVersionSignature = 7;
	required int32 clientVersion = 8;
	required bytes ocmfClientState = 9;
	required bytes epochStoragePrivateKey = 10;
	required bytes epochAuthPrivateKey = 11;
	required bytes deviceEpochHmac = 12;
}

message EncryptedSecretValuesOutput {
	required bytes encryptedDevicePrivateKey = 1;
	required bytes encryptedObliviousValidationTokenBlob = 2;
	required bytes encryptedEpochStoragePrivateKey = 3;
	required bytes encryptedOcmfClientState = 4;
	required bytes encryptedMailboxRootKeyBlob = 6;
	required bytes encryptedEpochAnonID = 7;
	required bytes encryptedEpochRootKey = 8;
}

message VirtualDeviceOutput {
	required bytes vdID = 1;
	required bytes vdPublicKey = 2;
	required bytes vdEpochStoragePublicKey = 3;
	required bytes vdEpochStoragePublicKeySig = 4;
	required bytes ocmfRotationToken = 5;
	required bytes deviceEpochHmac = 6;
	required EncryptedSecretValuesOutput encryptedSecretValues = 7;
}

message Epoch0Output {
	required uint64 epochFbid = 1;
	required bytes epochAnonID = 2;
	required bytes epochRootKeyFingerprint = 6;
	required bytes epochRootKey = 7;
}

message CreateBackupOutput {
	oneof result {
		CreateBackupSuccess success = 1;
		string error = 2;
	}
}

message CreateBackupSuccess {
	required DeviceOutput device = 1;
	required VirtualDeviceOutput virtualDevice = 2;
	required Epoch0Output epoch0 = 3;
	required bytes mailboxRootKey = 4;
}

message EncryptMessageOutput {
	oneof result {
		EncryptMessageSuccess success = 1;
		string error = 2;
	}
}

message EncryptMessageSuccess {
	required bytes encryptedProtobuf = 1;
	required bytes orfThreadID = 2;
	required string valueSecretRef = 3;
	required uint64 offlineThreadingID = 4;
	required uint64 timestampMS = 5;
}

message DecryptMessageOutput {
	oneof result {
		DecryptMessageSuccess success = 1;
		string error = 2;
	}
}

message DecryptMessageSuccess {
	required bytes plaintextPayload = 1;
}

message OrfThreadIdOutput {
	oneof result {
		OrfThreadIdSuccess success = 1;
		string error = 2;
	}
}

message OrfThreadIdSuccess {
	required bytes orfThreadID = 1;
}

message DeriveMessageKeyOutput {
	oneof result {
		DeriveMessageKeySuccess success = 1;
		string error = 2;
	}
}

message DeriveMessageKeySuccess {
	required bytes messageKey = 1;
}

message DeriveVirtualDeviceIdOutput {
	oneof result {
		DeriveVirtualDeviceIdSuccess success = 1;
		string error = 2;
	}
}

message DeriveVirtualDeviceIdSuccess {
	required bytes virtualDeviceID = 1;
}

message AddDeviceKeysOutput {
	required bytes devicePublicKey = 1;
	required bytes epochAuthPublicKey = 2;
	required bytes epochAuthPublicKeySig = 3;
	required bytes epochStoragePublicKey = 4;
	required bytes epochStoragePublicKeySig = 5;
	required bytes epochStoragePrivateKey = 6;
	required bytes orfClientState = 7;
}

message EpochKey {
	required uint64 serverEpochID = 1;
	required bytes epochAnonID = 2;
	required bytes epochRootKey = 3;
}

message PrepareAddDeviceOutput {
	oneof result {
		PrepareAddDeviceSuccess success = 1;
		string error = 2;
	}
}

message PrepareAddDeviceSuccess {
	required AddDeviceKeysOutput deviceKeys = 1;
	required EpochKey currentEpoch = 2;
	required bytes mailboxRootSalt = 3;
	required bytes orfRotationToken = 4;
	required bytes deviceEpochHmac = 5;
	required bytes epochRootKeyFingerprint = 6;
	repeated int32 supportedEncryptionVersions = 7;
	required bytes encryptionVersionSignature = 8;
	required int32 clientVersion = 9;
}

message RotateEpochMemberInput {
	required uint64 deviceID = 1;
	required bytes epochStoragePublicKey = 2;
	required bytes devicePublicKey = 3;
	required bytes prevDeviceEpochHmac = 4;
	required bytes epochStoragePublicKeySig = 5;
}

message RotateEpochInput {
	required bytes currentEpochRootKey = 1;
	required bytes currentEpochAnonID = 2;
	required uint64 currentEpochFbid = 3;
	required bytes epochStorageAuthPrivateKey = 4;
	repeated RotateEpochMemberInput members = 5;
}

message RotateEpochMemberEdge {
	required uint64 deviceID = 1;
	required bytes encryptedEpochKey = 2;
	required bytes deviceEpochHmac = 3;
}

message BackwardEdge {
	required bytes encryptedPrevEpochAnonID = 1;
	required bytes encryptedPrevEpochRootKey = 2;
	required bytes prevEpochRootKeyFingerprint = 3;
}

message RotateEpochOutput {
	oneof result {
		RotateEpochSuccess success = 1;
		string error = 2;
	}
}

message RotateEpochSuccess {
	required bytes newEpochRootKey = 1;
	required uint64 newEpochAnonID = 2;
	required bytes epochAnonID = 3;
	required BackwardEdge backwardEdge = 4;
	repeated RotateEpochMemberEdge memberEdges = 5;
	required bytes epochRootKeyFingerprint = 6;
}

message ComputeClientSealTokenInput {
	required bytes orfClientState = 1;
	required uint64 backupID = 2;
}

message ComputeClientSealTokenOutput {
	oneof result {
		ComputeClientSealTokenSuccess success = 1;
		string error = 2;
	}
}

message ComputeClientSealTokenSuccess {
	required bytes clientSealToken = 1;
}

message SealThreadIdInput {
	required bytes epochRootKey = 1;
	required bytes epochAnonID = 2;
	required uint64 backupID = 3;
	required string threadID = 4;
}

message SealThreadIdOutput {
	oneof result {
		SealThreadIdSuccess success = 1;
		string error = 2;
	}
}

message SealThreadIdSuccess {
	required bytes sealedThreadID = 1;
}

message OpenSealedThreadIdInput {
	required uint64 backupID = 1;
	required bytes sealedThreadID = 2;
	repeated EpochKey epochs = 3;
}

message OpenSealedThreadIdOutput {
	oneof result {
		OpenSealedThreadIdSuccess success = 1;
		string error = 2;
	}
}

message OpenSealedThreadIdSuccess {
	required string threadID = 1;
	required uint32 sealEpochAnonID = 2;
}

message EpochIds {
	required uint64 serverEpochID = 1;
	required bytes epochAnonID = 2;
}

message ForwardEdgeInput {
	required bytes encryptedEntropy = 1;
	required bytes authPublicKey = 2;
}

message EpochDerivationEdge {
	required EpochIds fromEpoch = 1;
	required EpochIds toEpoch = 2;
	optional ForwardEdgeInput forwardEdge = 3;
	optional bytes backwardEdge = 4;
}

message DeriveEpochsInput {
	required bytes epochStoragePrivateKey = 1;
	repeated EpochKey epochs = 2;
	repeated EpochDerivationEdge edges = 3;
}

message DeriveEpochsOutput {
	oneof result {
		DeriveEpochsSuccess success = 1;
		string error = 2;
	}
}

message DeriveEpochsSuccess {
	repeated EpochKey epochs = 1;
}

message PrepareAddPeerDeviceInput {
	required bytes advSecret = 1;
	required bytes sealedPayload = 2;
	required uint64 backupID = 3;
	required uint64 userID = 4;
	required bytes companionIdentityPub = 5;
	required uint64 activeEpochID = 6;
}

message PrepareAddPeerDeviceOutput {
	oneof result {
		PrepareAddPeerDeviceSuccess success = 1;
		string error = 2;
	}
}

message PrepareAddPeerDeviceSuccess {
	required PrepareAddDeviceSuccess enrolment = 1;
	required uint64 serverDataID = 2;
	required bytes companionDeviceBinding = 3;
}

message LabyrinthWaCommand {
	oneof commandInput {
		CreateBackupInput createBackupInput = 1;
		EncryptMessageInput encryptMessageInput = 2;
		DecryptMessageInput decryptMessageInput = 3;
		OrfThreadIdInput orfThreadIDInput = 4;
		DeriveMessageKeyInput deriveMessageKeyInput = 5;
		RotateEpochInput rotateEpochInput = 6;
		DeriveVirtualDeviceIdInput deriveVirtualDeviceIDInput = 7;
		PrepareAddDeviceInput prepareAddDeviceInput = 8;
		ComputeClientSealTokenInput computeClientSealTokenInput = 9;
		OpenSealedThreadIdInput openSealedThreadIDInput = 10;
		DeriveEpochsInput deriveEpochsInput = 11;
		SealThreadIdInput sealThreadIDInput = 12;
		PrepareAddPeerDeviceInput prepareAddPeerDeviceInput = 13;
	}
}
